<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" />
      <stop offset="60%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00C4FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#27F2FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Ambient Light Ring inside -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#27F2FF" stroke-width="1" stroke-opacity="0.15" />

  <!-- Background Subtle Grid -->
  <g opacity="0.06" stroke="#27F2FF" stroke-width="1.5">
    <line x1="80" y1="16" x2="80" y2="496" />
    <line x1="432" y1="16" x2="432" y2="496" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Glowing ML Monogram Core -->
  <g filter="url(#neonGlow)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 100.14 135.0 L 132.01 135.0 L 146.95 141.97 L 176.83 179.81 L 178.82 184.79 L 190.77 198.74 L 206.7 222.64 L 210.69 225.63 L 212.68 230.6 L 216.66 233.59 L 218.65 238.57 L 222.64 236.58 L 278.41 158.9 L 293.35 143.96 L 314.26 135.0 L 365.05 135.0 L 364.05 329.2 L 344.14 329.2 L 341.15 326.21 L 341.15 158.9 L 317.25 158.9 L 307.29 163.88 L 300.32 169.86 L 292.35 182.8 L 288.37 185.79 L 286.37 190.77 L 219.65 279.4 L 180.81 227.62 L 178.82 222.64 L 154.92 192.76 L 152.93 187.78 L 143.96 177.82 L 141.97 172.84 L 137.99 169.86 L 136.0 164.88 L 131.02 159.9 L 125.04 158.9 L 125.04 377.0 L 100.14 377.0 Z" fill="url(#cyanNeon)" />
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 315.26 189.77 L 316.25 328.2 L 320.23 340.15 L 326.21 347.12 L 339.16 353.1 L 411.86 353.1 L 411.86 355.09 L 409.86 356.09 L 398.91 377.0 L 335.17 377.0 L 320.23 372.02 L 311.27 366.05 L 299.32 352.1 L 293.35 337.16 L 292.35 263.47 L 245.54 325.21 L 234.59 340.15 L 224.63 344.14 L 214.67 344.14 L 208.7 342.14 L 199.73 334.18 L 197.74 329.2 L 179.81 307.29 L 177.82 302.31 L 154.92 273.43 L 152.93 268.45 L 148.94 265.46 L 148.94 224.63 L 218.65 319.24 L 220.65 319.24 Z" fill="url(#cyanNeon)" />
  </g>
</svg>
