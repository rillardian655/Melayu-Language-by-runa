<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" />
      <stop offset="60%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#5B86E5" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00C4FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#27F2FF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Banner Outer Card -->
  <rect x="8" y="8" width="904" height="224" rx="36" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.06" stroke="#27F2FF" stroke-width="1.2">
    <line x1="240" y1="8" x2="240" y2="232" />
    <line x1="8" y1="120" x2="912" y2="120" />
    <circle cx="120" cy="120" r="85" fill="none" stroke-dasharray="4,4" />
  </g>

  <!-- EMBLEM ICON ON THE LEFT (Center cx=120, cy=120) -->
  <g transform="translate(15, 15) scale(0.41)" filter="url(#neonGlow)">
    <!-- Squircle badge for icon -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="#0D1524" stroke="url(#borderGrad)" stroke-width="4" />

    <!-- Left Wing: Rising Bracket '<' -->
    <path d="M 120,335 L 120,205 Q 120,185 138,172 L 202,126 Q 220,113 234,128 L 256,154" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Wing: Rising Bracket '>' -->
    <path d="M 392,335 L 392,205 Q 392,185 374,172 L 310,126 Q 292,113 278,128 L 256,154" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Chevron Drop (Connecting into 'M') -->
    <path d="M 188,200 L 256,275 L 324,200" 
          fill="none" stroke="url(#cyanAccent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nusantara Maritime Wave Foundation (Bottom Base of 'M') -->
    <path d="M 105,340 C 145,310 190,345 256,325 C 322,305 367,340 407,340" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="16" stroke-linecap="round" />

    <!-- Core Terminal Code Dots (Digital Sparks) -->
    <circle cx="256" cy="154" r="9" fill="#FFFFFF" />
    <circle cx="256" cy="275" r="8" fill="#27F2FF" />
    <circle cx="120" cy="335" r="8" fill="#27F2FF" />
    <circle cx="392" cy="335" r="8" fill="#27F2FF" />
  </g>

  <!-- TYPOGRAPHY SECTION ON THE RIGHT -->
  <!-- Brand Name: MELAYU -->
  <text x="260" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', Roboto, Montserrat, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#cyanNeon)" filter="url(#neonGlow)">
    MELAYU
  </text>
  <text x="560" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#27F2FF" opacity="0.8">
    .ML
  </text>

  <!-- Tagline: Subtitle -->
  <text x="262" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" letter-spacing="1.5" fill="#E2E8F0">
    BAHASA PENGATURCARAAN SERUMPUN NUSANTARA
  </text>

  <!-- Regions Pill Badge -->
  <g transform="translate(262, 168)">
    <rect x="0" y="0" width="460" height="30" rx="15" fill="#131E33" stroke="#27F2FF" stroke-width="1" stroke-opacity="0.3" />
    <text x="230" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-weight="600" font-size="12" letter-spacing="2" fill="#27F2FF" text-anchor="middle">
      INDONESIA &bull; MALAYSIA &bull; BRUNEI &bull; SINGAPURA
    </text>
  </g>
</svg>
