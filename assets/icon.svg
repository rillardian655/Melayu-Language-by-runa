<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" />
      <stop offset="60%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Secondary Cyan/Teal Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#5B86E5" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27F2FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00C4FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#27F2FF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Ambient Light Ring inside -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#27F2FF" stroke-width="1" stroke-opacity="0.15" />

  <!-- Background Subtle Grid / Circuit Lines -->
  <g opacity="0.08" stroke="#27F2FF" stroke-width="1.5">
    <line x1="80" y1="16" x2="80" y2="496" />
    <line x1="432" y1="16" x2="432" y2="496" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Glowing Core Geometry (The "M" formed by Code Brackets '<' & '>' and Maritime Nusantara Wave Peak) -->
  <g filter="url(#neonGlow)">
    <!-- Ambient Neon Aura under the Logo -->
    <path d="M 120,340 L 120,200 L 195,140 L 256,220 L 317,140 L 392,200 L 392,340"
          fill="none" stroke="#27F2FF" stroke-width="36" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Wing: Rising Bracket '<' -->
    <path d="M 120,335 L 120,205 Q 120,185 138,172 L 202,126 Q 220,113 234,128 L 256,154" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Wing: Rising Bracket '>' -->
    <path d="M 392,335 L 392,205 Q 392,185 374,172 L 310,126 Q 292,113 278,128 L 256,154" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Chevron Drop (Connecting into 'M') -->
    <path d="M 188,200 L 256,275 L 324,200" 
          fill="none" stroke="url(#cyanAccent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nusantara Maritime Wave Foundation (Bottom Base of 'M') -->
    <path d="M 105,340 C 145,310 190,345 256,325 C 322,305 367,340 407,340" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="14" stroke-linecap="round" />

    <!-- Core Terminal Code Dots (Digital Sparks) -->
    <circle cx="256" cy="154" r="8" fill="#FFFFFF" />
    <circle cx="256" cy="275" r="7" fill="#27F2FF" />
    <circle cx="120" cy="335" r="7" fill="#27F2FF" />
    <circle cx="392" cy="335" r="7" fill="#27F2FF" />
  </g>

  <!-- Modern Slash Syntax Anchor </ > in Center -->
  <path d="M 235,360 L 277,300" stroke="#27F2FF" stroke-width="5" stroke-linecap="round" opacity="0.4" />
</svg>
